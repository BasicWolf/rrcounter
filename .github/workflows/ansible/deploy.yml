- name: Deploy rrcounter
  hosts: all
  become: true

  vars:
    service_name: rrcounter
    service_user: srvc-rrcounter
    install_dir: /opt/rrcounter
    binary_dir: "{{ install_dir }}/bin"
    binary_path: "{{ binary_dir }}/rrcounter"
    artifact_path: "{{ playbook_dir }}/../../../rrcounter"
    database_path: "/var/lib/rrcounter/visits.db"
    apparmor_profile: /etc/apparmor.d/opt.rrcounter.bin.rrcounter
    binary_args: "--db-path {{ database_path }}"

  tasks:
    - name: Ensure service user exists
      ansible.builtin.user:
        name: "{{ service_user }}"
        system: true
        create_home: false

    - name: Ensure application directory exists
      ansible.builtin.file:
        path: "{{ install_dir }}"
        state: directory
        owner: "{{ service_user }}"
        group: "{{ service_user }}"
        mode: "0755"

    - name: Ensure binary directory exists
      ansible.builtin.file:
        path: "{{ binary_dir }}"
        state: directory
        owner: root
        group: root
        mode: "0755"

    - name: Ensure database directory exists
      ansible.builtin.file:
        path: "/var/lib/rrcounter"
        state: directory
        owner: "{{ service_user }}"
        group: "{{ service_user }}"
        mode: "0755"

    - name: Install application binary
      ansible.builtin.copy:
        src: "{{ artifact_path }}"
        dest: "{{ binary_path }}"
        owner: root
        group: root
        mode: "0755"
      notify: Restart rrcounter

    - name: Install AppArmor profile
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/apparmor/opt.rrcounter.bin.rrcounter"
        dest: "{{ apparmor_profile }}"
        owner: root
        group: root
        mode: "0644"
      notify:
        - Restart rrcounter

    - name: Load AppArmor profile
      ansible.builtin.command:
        cmd: apparmor_parser -r "{{ apparmor_profile }}"
      changed_when: true
      when: not ansible_check_mode

    - name: Ensure AppArmor is enabled
      ansible.builtin.service:
        name: apparmor
        enabled: true
        state: started

    - name: Ensure database is owned by the service user
      ansible.builtin.file:
        path: "{{ database_path }}"
        state: touch
        owner: "{{ service_user }}"
        group: "{{ service_user }}"
        mode: "0644"
        modification_time: preserve
        access_time: preserve

    - name: Install systemd unit
      ansible.builtin.copy:
        dest: "/etc/systemd/system/{{ service_name }}.service"
        owner: root
        group: root
        mode: "0644"
        content: |
          [Unit]
          Description=RRCounter visitor counter
          Wants=network-online.target
          After=network-online.target

          [Service]
          Type=simple
          User={{ service_user }}
          Group={{ service_user }}
          WorkingDirectory={{ install_dir }}
          ExecStart={{ binary_path }} {{ binary_args }}
          Restart=on-failure
          RestartSec=5
          NoNewPrivileges=true
          PrivateTmp=true
          RestrictAddressFamilies=AF_INET
          IPAddressDeny=any
          IPAddressAllow=127.0.0.1
          SocketBindAllow=127.0.0.1:3000
          SocketBindDeny=any

          [Install]
          WantedBy=multi-user.target
      notify:
        - Reload systemd
        - Restart rrcounter

    - name: Ensure rrcounter is enabled and running
      ansible.builtin.systemd:
        name: "{{ service_name }}"
        enabled: true
        state: started
      when: not ansible_check_mode

  handlers:
    - name: Reload systemd
      ansible.builtin.systemd:
        daemon_reload: true
      when: not ansible_check_mode

    - name: Restart rrcounter
      ansible.builtin.systemd:
        name: "{{ service_name }}"
        state: restarted
      when: not ansible_check_mode
